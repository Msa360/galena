[package]
name = "galena"
version = "0.1.0"
edition = "2024"
description = "A modern Software Defined Radio (SDR) application"
authors = ["Arnaud Tremblay <arnaud25@icloud.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Msa360/galena"

[[bin]]
name = "Galena"
path = "src/main.rs"

[package.metadata.bundle]
name = "Galena"
identifier = "com.galena.sdr"
icon = ["assets/icon.ico", "assets/icon.png", "assets/icon.icns"]
version = "0.1.0"
resources = []
copyright = "Copyright (c) 2026"
category = "public.app-category.utilities"
short_description = "Software Defined Radio Application"
long_description = "A modern SDR application for receiving and demodulating radio signals using RTL-SDR hardware"

[dependencies]
iced = { version = "0.13", features = ["canvas"] }
rtl-sdr-rs = "0.2.1"
num-complex = "0.4"
rustfft = "6.4.1"
log = "0.4.29"
env_logger = "0.11.8"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
rodio = "0.21.1"
ringbuf = "0.4.9"
hound = "3.5"
rfd = "0.15"

