[package]
name = "galena"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Galena"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["canvas"] }
rtl-sdr-rs = "0.2.1"
num-complex = "0.4"
rustfft = "6.4.1"
log = "0.4.29"
env_logger = "0.11.8"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
rodio = "0.21.1"
ringbuf = "0.4.9"
hound = "3.5"
rfd = "0.15"

